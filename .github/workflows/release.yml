name: Release

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push the image to GHCR

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # dynver derives the version from the tag + history
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: sbt
      - uses: sbt/setup-sbt@v1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push image
        env:
          VALISTRIO_RELEASE: "true"
        run: sbt app/Docker/publish   # pushes ghcr.io/dilyand/valistrio:<version> and :latest

      # Pre-release tags (e.g. 0.1.0-alpha.1) still build and push a version-stamped
      # image above, but only prod-ready versions get a GitHub Release.
      - name: Extract changelog section
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          awk -v v="$GITHUB_REF_NAME" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            /^## \[/ {if (p) exit}
            p {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$GITHUB_REF_NAME]' section"
            exit 1
          fi

      - name: Create GitHub Release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
