valistrio {
  server {
    host = 0.0.0.0
    port = 8080
    maxBytes = 2097152
    requestTimeout = 5s
  }

  schemaRegistry {
    url = "http://localhost:8081"
    timeoutMs = 3000
    cacheCapacity = 2000
  }

  kafka {
    bootstrapServers = "localhost:9092"
    topics {
      events = "valistrio.events"
      dlq = "valistrio.dlq"
    }
  }
}
