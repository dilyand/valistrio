valistrio {
  server {
    host = 0.0.0.0
    port = 8080

    # Limits the size of any request
    maxBytes = 2097152 # 2MB

    # Total time allowed for a request to be handled end-to-end
    requestTimeout = 5s
  }

  schemaRegistry {
    # Confluent Schema Registry base URL
    url = "http://localhost:8081"

    # Timeout (ms) for each Schema Registry call (fetch or register)
    timeoutMs = 3000
  }
}
